name: Android Artifact Build

on:
  push:
    branches:
      - feature/musixmatch-lyrics-translation
      - RS_DEV
  pull_request:
    branches:
      - Ry_DEV
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run lint and build both APK variants
        run: |
          ./gradlew --no-daemon --stacktrace \
            lint \
            :app:assembleNormalDebug \
            :app:assembleFdroidDebug

      - name: Upload Normal Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: retro-music-normal-debug
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload F-Droid Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: retro-music-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
